<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sathya</title>
  <meta name="description" content="about me, my photos, my work, and my travels">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=League+Script&family=Special+Elite&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="desk">
    <header class="greeting">
      <h1>hi! i'm sathya !</h1>
      <p class="tagline" data-text="welcome! click around to learn about me :)"></p>
    </header>
    <!-- top left -->
    <a class="object" data-section="stills" href="stills.html">
      <img src="assets/images/stills.png" alt="">
      <span class="caption">stills</span>
    </a>
    <!-- top right -->
    <a class="object" data-section="professional" href="professional.html">
      <img src="assets/images/professional.png" alt="">
      <span class="filename">Sathya_Seelam_Resume</span>
      <span class="caption">professional</span>
    </a>
    <!-- bottom left: album with a vinyl that slides out and spins while the song plays.
         Audio file goes in assets/audio/song.mp3 -->
    <div class="object player" data-section="music">
      <div class="vinyl" aria-hidden="true"></div>
      <img class="album" src="assets/images/music.jpeg" alt="">
      <button class="play" type="button" aria-label="Play song">
        <svg class="icon-play" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg>
        <svg class="icon-pause" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 5h4v14H6zm8 0h4v14h-4z"/></svg>
      </button>
      <audio class="track" src="assets/audio/song.mp3" preload="none" loop></audio>
      <span class="caption">on repeat</span>
    </div>
    <!-- bottom middle -->
    <a class="object" data-section="travel" href="travel.html">
      <img src="assets/images/travel.png" alt="">
      <span class="caption">travel</span>
    </a>
    <!-- bottom right -->
    <a class="object" data-section="food" href="food.html">
      <img src="assets/images/food.png" alt="">
      <span class="caption">food</span>
    </a>
  </main>
  <p class="mobile-note">p.s. this looks way better on desktop</p>
  <script type="module" src="script.js"></script>
</body>
</html>
